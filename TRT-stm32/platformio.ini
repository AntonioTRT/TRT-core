[platformio]
default_envs = nucleo_l073rz

[env:nucleo_l073rz]
platform = ststm32
board = nucleo_l073rz
framework = stm32cube
upload_protocol = stlink
monitor_speed = 115200
build_flags =
    -DSTM32L073xx
    -DUSE_HAL_DRIVER
    -DTRT_HAS_STL=1
    -DTRT_HAS_DYNAMIC_MEMORY=1
    -DTRT_HAS_MODULES=1
    -DTRT_MAX_FRAME_SIZE=256
    -std=gnu99
    -std=gnu++17
    -I../trt-core
extra_scripts =
    pre:platformio_extra.py
